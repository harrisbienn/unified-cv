        summary: Builds and maintains reproducible geospatial workflows and decision-support tools for flood risk, hazard assessment, stormwater, and coastal applications.
        highlights:
          - Supports enterprise GIS implementation, cloud integration, and migration to modern GIS architecture.
          - Develops Python-based tools that streamline spatial analysis, data processing, and reporting.
          - Trains and mentors teams in GIS methods, software, and reproducible workflows.
      - company: The Water Institute of the Gulf
        position: Research Scientist
        start_date: 2013
        end_date: 2024
        location: Baton Rouge, Louisiana
        summary: Conducted geospatial analysis and research and built narratives for scientific communication.
        highlights:
          - Developed cartographic, geospatial-processing, and visualization products for coastal and resilience applications.
          - Contributed to peer-reviewed research on restoration planning, community engagement, vulnerability, and ecosystem conditions.
