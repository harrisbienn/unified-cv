    Career Summary:
      - Geospatial practitioner and knowledge broker building reproducible geospatial workflows and decision-support tools for flood risk, hazard assessment, stormwater, and coastal applications. My work connects GIS, hydrologic and hydraulic modeling, scientific computing, and cartography.

